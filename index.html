<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root { --bg: #f6efe2; --ink: #22170f; --muted: #6e5c48; --rule: #e0d2bb; --link: #b4561c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #18110d; --ink: #eedeba; --muted: #b29b7c; --rule: #3a2c22; --link: #ffaa5a; } }
  body { background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; }
  main { max-width: 42rem; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 2rem 0 .5rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
  p, li { margin: .5rem 0; }
  .muted { color: var(--muted); }
  a { color: var(--link); }
  img.icon { width: 96px; height: 96px; border-radius: 22px; image-rendering: pixelated; }
</style>
</head>
<body>
<main>
<img class="icon" src="icon.png" alt="SnapBack app icon">
<h1>SnapBack</h1>
<p class="muted">The Rubber-Band Dungeon. For iPhone.</p>
<p>String elastic bands between brass pegs, pluck them to slice, and pull them back like slingshots to fling slimes, beetles and bomb-rats back up the dungeon before they reach your gate.</p>
<ul>
  <li><a href="support.html">Support</a></li>
  <li><a href="privacy.html">Privacy policy</a></li>
  <li><a href="terms.html">Terms of use</a></li>
</ul>
</main>
</body>
</html>
